name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - production
  # Relanzar sin commits nuevos (Actions → Run workflow).
  workflow_dispatch:

# Un despliegue a la vez. Si llegan varios, solo espera el más reciente y el que está en curso
# termina.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: vamosjuntos-club

jobs:
  deploy:
    # "Run workflow" desde otra rama no publica nada.
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Compuerta de calidad (constitución, Principio IV): tsc -b && vite build.
      - name: Typecheck and build
        run: npm run build

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/54833988307/locations/global/workloadIdentityPools/github-pool/providers/github-frontend-provider
          service_account: github-actions-frontend@vamosjuntos-club.iam.gserviceaccount.com

      # firebase-tools usa las credenciales que deja el paso anterior en
      # GOOGLE_APPLICATION_CREDENTIALS.
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@15.33.0 deploy --only hosting --project "$PROJECT_ID" --message "$GITHUB_SHA" --non-interactive
