name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - production
  # Relanzar sin commits nuevos (Actions → Run workflow).
  workflow_dispatch:

# Un despliegue a la vez. Si llegan varios, solo espera el más reciente y el que está en curso
# termina.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: vamosjuntos-club

jobs:
  deploy:
    # "Run workflow" desde otra rama no publica nada.
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sin esta configuración el build pasa, pero la app publicada falla al abrir.
      - name: Validate Firebase config
        run: |
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            test -n "${!v}" || (echo "Missing GitHub variable $v" && exit 1)
          done
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      # Compuerta de calidad (constitución, Principio IV): tsc -b && vite build.
      # La configuración web de Firebase es pública (constitución v3.0.0): llega como variables de
      # repositorio de GitHub, no como secrets, igual que en kaizen-app.
      - name: Typecheck and build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/54833988307/locations/global/workloadIdentityPools/github-pool/providers/github-frontend-provider
          service_account: github-actions-frontend@vamosjuntos-club.iam.gserviceaccount.com

      # firebase-tools usa las credenciales que deja el paso anterior en
      # GOOGLE_APPLICATION_CREDENTIALS.
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@15.33.0 deploy --only hosting --project "$PROJECT_ID" --message "$GITHUB_SHA" --non-interactive
